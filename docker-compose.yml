# Puertos configurables: DB_PORT=5433 API_PORT=3010 docker compose up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 10

  migrate:
    build: { context: ./api, target: migrator }
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./api, target: runner }
    ports: ["${API_PORT:-3000}:3000"]
    env_file: [{ path: ./api/.env, required: false }]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
